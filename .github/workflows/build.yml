name: Test and build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tests/test_parser.py
      - run: python tests/test_retry.py

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pyinstaller
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Scrybe --icon scrybe.ico --version-file version_info.txt scrybe.py
      - uses: actions/upload-artifact@v4
        with:
          name: Scrybe-windows
          path: dist/Scrybe.exe
      - name: Attach Scrybe.exe to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/Scrybe.exe --clobber
